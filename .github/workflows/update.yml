name: Sync Match Day

on:
  schedule:
    # تشغيل تلقائي كل 30 دقيقة
    - cron: '*/30 * * * *'
  # إمكانية التشغيل اليدوي من تبويب Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # إنشاء الملف إحتياطياً في حال لم يقم السكريبت بإنشائه تجنباً للخطأ
          touch matches.json
          
          git add matches.json
          git commit -m "Auto update matches data" || exit 0
          git push
